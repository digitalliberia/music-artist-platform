<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - LibMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-music me-2"></i>LibMusic
            </a>
            <div class="ms-auto">
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="list-group list-group-flush">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="profile.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-user me-2"></i>Profile
                    </a>
                    <a href="upload.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-upload me-2"></i>Upload Music
                    </a>
                </div>
            </div>
            
            <div class="col-md-9 col-lg-10 main-content">
                <div class="glass-card">
                    <div class="card-header bg-transparent">
                        <h4>Artist Profile</h4>
                        <p class="text-muted">Create and edit your artist profile</p>
                    </div>
                    <div class="card-body">
                        <form id="profileForm">
                            <!-- Profile Picture Section -->
                            <div class="mb-4 text-center">
                                <div class="position-relative d-inline-block">
                                    <div id="profilePictureContainer" class="rounded-circle overflow-hidden" style="width: 150px; height: 150px; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer;">
                                        <img id="profilePictureImg" src="" alt="Profile Picture" style="width: 100%; height: 100%; object-fit: cover;">
                                        <div class="d-flex align-items-center justify-content-center" style="width: 100%; height: 100%;">
                                            <i id="profilePlaceholderIcon" class="fas fa-user fa-4x text-white"></i>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle" style="width: 40px; height: 40px;" onclick="document.getElementById('profilePicture').click()">
                                        <i class="fas fa-camera"></i>
                                    </button>
                                </div>
                                <input type="file" id="profilePicture" accept="image/*" style="display: none;">
                                <p class="text-muted mt-2 small">Click camera to upload profile picture</p>
                                <div id="profilePictureProgress" class="progress mt-2 d-none" style="height: 5px;">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Artist Name</label>
                                <input type="text" id="artistName" class="form-control glass-input" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Genre</label>
                                <select id="genre" class="form-control glass-input">
                                    <option>HipCo</option>
                                    <option>TrapCo</option>
                                    <option>KoloPop</option>
                                    <option>Koloress</option>
                                    <option>AfroBeats</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Bio</label>
                                <textarea id="bio" rows="5" class="form-control glass-input" placeholder="Tell your story as a Liberian artist..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" id="location" class="form-control glass-input" placeholder="e.g., Monrovia, Liberia">
                            </div>
                            <div id="profileMessage" class="alert d-none"></div>
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module">
        import { auth, db, storage } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        
        const profileForm = document.getElementById('profileForm');
        const profileMessage = document.getElementById('profileMessage');
        const profilePictureInput = document.getElementById('profilePicture');
        const profilePictureImg = document.getElementById('profilePictureImg');
        const profilePlaceholderIcon = document.getElementById('profilePlaceholderIcon');
        const profilePictureProgress = document.getElementById('profilePictureProgress');
        let currentProfilePictureUrl = '';
        let currentProfilePicturePath = '';
        
        const showMessage = (message, isError = false) => {
            profileMessage.textContent = message;
            profileMessage.className = `alert ${isError ? 'alert-danger' : 'alert-success'} show`;
            setTimeout(() => {
                profileMessage.classList.add('d-none');
            }, 3000);
        };
        
        const updateProfilePictureDisplay = (imageUrl) => {
            if (imageUrl) {
                profilePictureImg.src = imageUrl;
                profilePictureImg.style.display = 'block';
                profilePlaceholderIcon.style.display = 'none';
            } else {
                profilePictureImg.style.display = 'none';
                profilePlaceholderIcon.style.display = 'flex';
            }
        };
        
        const uploadProfilePicture = async (file, userId) => {
            return new Promise((resolve, reject) => {
                const timestamp = Date.now();
                const fileExtension = file.name.split('.').pop();
                const picturePath = `profilePictures/${userId}/profile_${timestamp}.${fileExtension}`;
                const pictureRef = ref(storage, picturePath);
                const uploadTask = uploadBytesResumable(pictureRef, file);
                
                profilePictureProgress.classList.remove('d-none');
                const progressBarInner = profilePictureProgress.querySelector('.progress-bar');
                
                uploadTask.on('state_changed',
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBarInner.style.width = progress + '%';
                    },
                    (error) => {
                        profilePictureProgress.classList.add('d-none');
                        reject(error);
                    },
                    async () => {
                        const downloadUrl = await getDownloadURL(uploadTask.snapshot.ref);
                        profilePictureProgress.classList.add('d-none');
                        resolve({ url: downloadUrl, path: picturePath });
                    }
                );
            });
        };
        
        const loadProfile = async () => {
            const userId = auth.currentUser?.uid;
            if (userId) {
                const profileRef = doc(db, 'artists', userId);
                const profileDoc = await getDoc(profileRef);
                if (profileDoc.exists()) {
                    const data = profileDoc.data();
                    document.getElementById('artistName').value = data.artistName || '';
                    document.getElementById('genre').value = data.genre || 'HipCo';
                    document.getElementById('bio').value = data.bio || '';
                    document.getElementById('location').value = data.location || '';
                    
                    if (data.profilePictureUrl) {
                        currentProfilePictureUrl = data.profilePictureUrl;
                        currentProfilePicturePath = data.profilePicturePath || '';
                        updateProfilePictureDisplay(data.profilePictureUrl);
                    }
                }
            }
        };
        
        profilePictureInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file && auth.currentUser) {
                if (file.size > 5 * 1024 * 1024) {
                    showMessage('Profile picture must be less than 5MB', true);
                    return;
                }
                
                try {
                    // Delete old profile picture if exists
                    if (currentProfilePicturePath) {
                        const oldPictureRef = ref(storage, currentProfilePicturePath);
                        await deleteObject(oldPictureRef).catch(() => {});
                    }
                    
                    const { url, path } = await uploadProfilePicture(file, auth.currentUser.uid);
                    currentProfilePictureUrl = url;
                    currentProfilePicturePath = path;
                    updateProfilePictureDisplay(url);
                    showMessage('Profile picture uploaded! Save your profile to keep it.');
                } catch (error) {
                    showMessage('Error uploading profile picture: ' + error.message, true);
                }
            }
        });
        
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = auth.currentUser.uid;
            
            const profileData = {
                artistName: document.getElementById('artistName').value,
                genre: document.getElementById('genre').value,
                bio: document.getElementById('bio').value,
                location: document.getElementById('location').value,
                email: auth.currentUser.email,
                updatedAt: new Date()
            };
            
            if (currentProfilePictureUrl) {
                profileData.profilePictureUrl = currentProfilePictureUrl;
                profileData.profilePicturePath = currentProfilePicturePath;
            }
            
            try {
                await setDoc(doc(db, 'artists', userId), profileData);
                showMessage('Profile saved successfully!');
                
                // Update navbar email display if on dashboard
                if (window.opener) {
                    window.opener.postMessage('profileUpdated', '*');
                }
            } catch (error) {
                showMessage('Error saving profile: ' + error.message, true);
            }
        });
        
        auth.onAuthStateChanged((user) => {
            if (user) {
                loadProfile();
            } else {
                window.location.href = 'index.html';
            }
        });
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
