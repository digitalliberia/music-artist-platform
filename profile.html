<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BeatStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-headphones me-2"></i>BeatStream
            </a>
            <div class="ms-auto">
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="list-group list-group-flush">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="profile.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-user me-2"></i>Profile
                    </a>
                    <a href="upload.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-upload me-2"></i>Upload Music
                    </a>
                </div>
            </div>
            
            <div class="col-md-9 col-lg-10 main-content">
                <div class="card bg-dark text-white">
                    <div class="card-header">
                        <h4>Artist Profile</h4>
                    </div>
                    <div class="card-body">
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label">Artist Name</label>
                                <input type="text" id="artistName" class="form-control bg-dark text-white" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Genre</label>
                                <select id="genre" class="form-control bg-dark text-white">
                                    <option>Hip Hop</option>
                                    <option>Pop</option>
                                    <option>Rock</option>
                                    <option>Electronic</option>
                                    <option>Jazz</option>
                                    <option>Classical</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Bio</label>
                                <textarea id="bio" rows="5" class="form-control bg-dark text-white" placeholder="Tell your story..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" id="location" class="form-control bg-dark text-white">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const profileForm = document.getElementById('profileForm');
        
        // Load profile data
        const loadProfile = async () => {
            const userId = auth.currentUser?.uid;
            if (userId) {
                const profileRef = doc(db, 'artists', userId);
                const profileDoc = await getDoc(profileRef);
                if (profileDoc.exists()) {
                    const data = profileDoc.data();
                    document.getElementById('artistName').value = data.artistName || '';
                    document.getElementById('genre').value = data.genre || '';
                    document.getElementById('bio').value = data.bio || '';
                    document.getElementById('location').value = data.location || '';
                }
            }
        };
        
        // Save profile
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = auth.currentUser.uid;
            await setDoc(doc(db, 'artists', userId), {
                artistName: document.getElementById('artistName').value,
                genre: document.getElementById('genre').value,
                bio: document.getElementById('bio').value,
                location: document.getElementById('location').value,
                email: auth.currentUser.email,
                updatedAt: new Date()
            });
            alert('Profile saved successfully!');
        });
        
        auth.onAuthStateChanged((user) => {
            if (user) {
                loadProfile();
            } else {
                window.location.href = 'index.html';
            }
        });
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
