<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LibMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-music me-2"></i>LibMusic
            </a>
            <div class="ms-auto dropdown">
                <button class="btn btn-link dropdown-toggle text-white text-decoration-none" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img id="navProfilePic" src="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: none;">
                    <i id="navProfileIcon" class="fas fa-user-circle fa-2x"></i>
                    <span id="userEmail" class="ms-2"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="profile.html"><i class="fas fa-user me-2"></i>Edit Profile</a></li>
                    <li><a class="dropdown-item" href="dashboard.html"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a></li>
                    <li><a class="dropdown-item" href="upload.html"><i class="fas fa-upload me-2"></i>Upload Music</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" id="logoutBtn" href="#"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="list-group list-group-flush">
                    <a href="dashboard.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="profile.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-user me-2"></i>Profile
                    </a>
                    <a href="upload.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-upload me-2"></i>Upload Music
                    </a>
                </div>
            </div>
            
            <div class="col-md-9 col-lg-10 main-content">
                <div class="row">
                    <div class="col-12">
                        <div class="stats-cards mb-4">
                            <div class="row g-4">
                                <div class="col-md-3">
                                    <div class="stat-card">
                                        <i class="fas fa-headphones"></i>
                                        <h3 id="totalStreams">0</h3>
                                        <p>Total Streams</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stat-card">
                                        <i class="fas fa-music"></i>
                                        <h3 id="totalTracks">0</h3>
                                        <p>Tracks Uploaded</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stat-card">
                                        <i class="fas fa-users"></i>
                                        <h3 id="totalListeners">0</h3>
                                        <p>Unique Listeners</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stat-card">
                                        <i class="fas fa-dollar-sign"></i>
                                        <h3 id="totalEarnings">$0</h3>
                                        <p>Total Earnings</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="glass-card">
                            <div class="card-header bg-transparent">
                                <h4>Your Music Library</h4>
                                <p class="text-muted">Manage and delete your tracks</p>
                            </div>
                            <div class="card-body">
                                <div id="musicLibrary" class="row g-4">
                                    <!-- Dynamic content will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
