<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Music - LibMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-music me-2"></i>LibMusic
            </a>
            <div class="ms-auto">
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="list-group list-group-flush">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="profile.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-user me-2"></i>Profile
                    </a>
                    <a href="upload.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-upload me-2"></i>Upload Music
                    </a>
                </div>
            </div>
            
            <div class="col-md-9 col-lg-10 main-content">
                <div class="glass-card">
                    <div class="card-header bg-transparent">
                        <h4>Upload Your Track</h4>
                        <p class="text-muted">Supported formats: MP3, MP4, WAV, FLAC, M4A, OGG (Max 50MB)</p>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="form-label">Track Title</label>
                                <input type="text" id="trackTitle" class="form-control glass-input" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Audio/Video File</label>
                                <input type="file" id="audioFile" class="form-control glass-input" accept="audio/*,video/mp4,video/mpeg" required>
                                <small class="text-muted">Any music format - MP3, MP4, WAV, FLAC, etc.</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cover Art (Optional)</label>
                                <input type="file" id="coverArt" class="form-control glass-input" accept="image/*">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duration (seconds)</label>
                                <input type="number" id="duration" class="form-control glass-input" required>
                            </div>
                            <div id="uploadProgress" class="progress mb-3 d-none">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                            </div>
                            <div id="uploadMessage" class="alert d-none"></div>
                            <button type="submit" class="btn btn-primary">Upload Track</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/upload.js"></script>
</body>
</html>
